<!DOCTYPE html>
<html>
<head>
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js"></script>
</head>

<body>

    <input 
        type="text" 
        id="listTitle" 
        value="My To-Do List"
        onkeydown="if (event.key === 'Enter') { this.blur(); }"
    >

    <p id="date"></p>

    <button onclick="addTask()">+ Add Task</button>

    <div id="taskList"></div>

</body>
</html>
