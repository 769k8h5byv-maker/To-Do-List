<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>My To-Do Lists</title>

    <link rel="stylesheet" href="style.css">

    <script src="script.js" defer></script>
</head>

<body>

    <!-- LIST TABS -->
    <div id="tabs"></div>


    <!-- NEW LIST BOX -->
    <div id="newListBox" class="newListBox">

        <h2>New List</h2>

        <input
            type="text"
            id="newListName"
            placeholder="Name your list"
        >

        <div class="newListButtons">

            <button id="cancelList">
                Cancel
            </button>

            <button id="createList">
                Create
            </button>

        </div>

    </div>


    <!-- LIST TITLE -->
    <div id="titleContainer">

        <h1 id="listTitle">
            My To-Do List
        </h1>

        <button
            id="editTitleButton"
            aria-label="Rename list"
        >
            ✎
        </button>

    </div>


    <!-- DATE -->
    <p id="date"></p>


    <!-- ADD TASK -->
    <button id="addTaskButton">
        + Add Task
    </button>


    <!-- TASKS -->
    <div id="taskList"></div>


</body>

</html>
